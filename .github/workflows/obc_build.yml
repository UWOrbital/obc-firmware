name: OBC Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential cmake

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Sync submodule to matching branch
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: |
        echo "orbital-software repo branch: $BRANCH_NAME"

        git submodule update --init interfaces

    - name: Create binary directory
      run: |
        mkdir build
        cd build
        export REPO_ROOT=$(git rev-parse --show-toplevel)

    - name: Build (Release-Launchpad)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=RM46_LAUNCHPAD -DDEBUG=0
        make

    - name: Build (Release-OBC Rev1)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=OBC_REVISION_1 -DDEBUG=0
        make

    - name: Build (Release-OBC Rev2)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=OBC_REVISION_2 -DDEBUG=0
        make

    - name: Build (Debug-Launchpad)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=RM46_LAUNCHPAD -DDEBUG=1
        make

    - name: Build (Debug-OBC Rev1)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=OBC_REVISION_1 -DDEBUG=1
        make

    - name: Build (Debug-OBC Rev2)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=OBC_REVISION_2 -DDEBUG=1
        make

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: bin-file
        path: build/OBC-firmware.bin

  crc:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download binary
      uses: actions/download-artifact@v4
      with:
        name: bin-file
        path: .

    - name: Display CRC
      run: |
        echo "CRC checksum:"
        cksum OBC-firmware.bin

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/selvahini/nexus-ci'
    needs: crc
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Download Firmware
        uses: actions/download-artifact@v4
        with:
          name: bin-file
          path: release_input

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Release Package
        run: |
          python scripts/package_release.py \
            --binary release_input/OBC-firmware.bin \
            --board OBC_REVISION_2 \
            --build-type Release

      - name: Display Release Contents
        shell: bash
        run: |
          VERSION=$(find release -mindepth 1 -maxdepth 1 -type d | head -n 1 | xargs basename)

          echo "Release version: $VERSION"
          echo "Release contents:"
          find "release/$VERSION" -maxdepth 1 -type f -print

      - name: Verify Release Package
        shell: bash
        run: |
          VERSION=$(find release -mindepth 1 -maxdepth 1 -type d | head -n 1 | xargs basename)

          python scripts/verify_release.py \
            --release "release/$VERSION"

      - name: Upload Release to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        shell: bash
        run: |
          VERSION=$(find release -mindepth 1 -maxdepth 1 -type d | head -n 1 | xargs basename)

          echo "Uploading release $VERSION to Nexus..."

          for file in "release/$VERSION"/*; do
              filename=$(basename "$file")

              echo "Uploading $filename"

              curl --fail --silent --show-error \
                -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
                --upload-file "$file" \
                "$NEXUS_URL/repository/firmware-releases/$VERSION/$filename"
          done

          echo "Nexus upload complete."

      - name: Upload Release Package as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: release/
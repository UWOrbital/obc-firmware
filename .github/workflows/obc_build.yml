name: OBC Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential cmake

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Sync submodule to matching branch
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: |
        echo "orbital-software repo branch: $BRANCH_NAME"

        git submodule update --init interfaces

    - name: Create binary directory
      run: |
        mkdir build
        cd build
        export REPO_ROOT=$(git rev-parse --show-toplevel)

    - name: Build (Release-Launchpad)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=RM46_LAUNCHPAD -DDEBUG=0
        make

    - name: Build (Release-OBC Rev1)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=OBC_REVISION_1 -DDEBUG=0
        make

    - name: Build (Release-OBC Rev2)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=OBC_REVISION_2 -DDEBUG=0
        make

    - name: Build (Debug-Launchpad)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=RM46_LAUNCHPAD -DDEBUG=1
        make

    - name: Build (Debug-OBC Rev1)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=OBC_REVISION_1 -DDEBUG=1
        make

    - name: Build (Debug-OBC Rev2)
      run: |
        source .venv/bin/activate
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=OBC -G"Unix Makefiles" -DBOARD_TYPE=OBC_REVISION_2 -DDEBUG=1
        make

    - name: Build and compare compile-time logging IDs
      run: |
        source .venv/bin/activate
        for mode in OFF ON; do
          if [ "$mode" = ON ]; then build_dir=build-log-ids; else build_dir=build-log-paths; fi
          mkdir -p "$build_dir"
          ln -s "$PWD/build/toolchain" "$build_dir/toolchain"
          cmake -S . -B "$build_dir" -DCMAKE_BUILD_TYPE=OBC -DBOARD_TYPE=RM46_LAUNCHPAD \
            -DDEBUG=0 -DLOG_DEFAULT_OUTPUT_FORMAT=LOG_FORMAT_BINARY -DLOG_USE_FILE_IDS="$mode"
          cmake --build "$build_dir" --target OBC-firmware.out -j 4
          cmake --build "$build_dir" --target OBC_firmware-crc_bin -j 4
          cmake --build "$build_dir" --target firmware_crc -j 4
        done
        python3 scripts/compare_log_file_id_builds.py build-log-paths build-log-ids

    - name: Upload logging comparison binaries and mappings
      uses: actions/upload-artifact@v4
      with:
        name: logging-size-comparison
        path: |
          build-log-paths/OBC-firmware.bin
          build-log-paths/generated/logging/log_file_ids.json
          build-log-ids/OBC-firmware.bin
          build-log-ids/generated/logging/log_file_ids.json

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: bin-file
        path: build/OBC-firmware.bin

  crc:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download binary
      uses: actions/download-artifact@v4
      with:
        name: bin-file
        path: .

    - name: Display CRC
      run: |
        echo "CRC checksum:"
        cksum OBC-firmware.bin

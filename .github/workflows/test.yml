name: Test
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        log_file_ids: ['OFF', 'ON']

    steps:
    - uses: actions/checkout@v3
    - name: Install GNU cross compilation
      run: |
        sudo apt-get update
        sudo apt-get install gcc-multilib g++-multilib
    - name: Sync submodule to matching branch
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: |
        echo "orbital-software repo branch: $BRANCH_NAME"

        git submodule update --init interfaces
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Test -DLOG_USE_FILE_IDS=${{ matrix.log_file_ids }}
    - name: Build
      run: |
        cd build
        cmake --build .
    - name: Run Tests
      run: |
        cd build
        ctest --verbose
    - name: Check logging source generation and runtime modes
      if: matrix.log_file_ids == 'ON'
      run: |
        python3 -m unittest discover -s test/scripts -p 'test_*.py' -v
        cmake -S test/logging -B build-logging -DLOG_MAPPING_DIR="$PWD/build/generated/logging"
        cmake --build build-logging -j 4
        ctest --test-dir build-logging --output-on-failure
